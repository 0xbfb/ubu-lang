name: Bootstrap R00-R02

on:
  push:
    branches:
      - agent/r00-r02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply validated payload
        shell: bash
        run: |
          set -euo pipefail
          cat automation/r00-r02/part-* > /tmp/ubu-r00-r02.b64
          base64 --decode /tmp/ubu-r00-r02.b64 > /tmp/ubu-r00-r02.tar.xz
          echo "0f1e9336a08c636cca743925586a6a0df95400791da32f38d73666f1d9f8ed32  /tmp/ubu-r00-r02.tar.xz" | sha256sum -c -
          git ls-files -z | xargs -0 -r rm -f
          tar -xJf /tmp/ubu-r00-r02.tar.xz -C .
          rm -rf automation/r00-r02
          rm -f .github/workflows/bootstrap-r00-r02.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete R00-R02 governance, CI and reproducible releases"
          git push origin HEAD:agent/r00-r02
